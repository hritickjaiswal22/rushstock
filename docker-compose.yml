services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-postgres
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash_dev
    ports:
      - "5432:5432"
    volumes:
      - flash_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flash-redis
    ports:
      - "6379:6379"
    volumes:
      - flash_redis_data:/data

volumes:
  flash_pg_data:
  flash_redis_data:

# docker compose up -d -> Start everything in background

# Let me explain every line,

# | Line | Meaning |
# |---|---|
# | `services:` | "Here are the containers I want to run." |
# | `postgres:` / `redis:` | Names you're giving them (you pick these). |
# | `image: postgres:16-alpine` | Which pre-built image to use. `alpine` = a tiny Linux distro, keeps the download small. |
# | `container_name: flash-postgres` | A friendly name so you can refer to it (`docker stop flash-postgres`). |
# | `environment:` | Environment variables passed *into* the container. Postgres reads these on first boot to set up the user/password/db. |
# | `ports: "5432:5432"` | Format is `HOST:CONTAINER`. "Expose the container's port 5432 on my laptop's port 5432." |
# | `volumes:` | Persist data so it survives restarts. Without this, stopping the container wipes the DB. |

